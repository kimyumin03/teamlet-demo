<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Teamlet — Home Hi-Fi v1</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root[data-theme="light"] {
    --bg: #f6f7f9;
    --bg-primary: #ffffff;
    --bg-secondary: #f1f3f6;
    --bg-tertiary: #e8ebf0;
    --fg: #0b1220;
    --fg-muted: #475569;
    --fg-subtle: #8b95a7;
    --border: #e3e7ee;
    --border-strong: #ccd2dc;
    --border-focus: var(--primary);
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06), 0 2px 4px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 20px 32px -16px rgba(15, 23, 42, 0.12), 0 8px 16px -8px rgba(15, 23, 42, 0.08);
    --kbd-bg: #f5f7fa;

    --destructive: #dc2626;
    --destructive-50: #fef2f2;
    --destructive-600: #dc2626;
    --destructive-700: #b91c1c;

    --success: #16a34a;
    --success-50: #f0fdf4;

    --warn: #d97706;
    --warn-50: #fffbeb;

    --info: #0284c7;
    --info-50: #f0f9ff;
  }
  :root[data-theme="dark"] {
    --bg: #0a0d14;
    --bg-primary: #11141c;
    --bg-secondary: #181c25;
    --bg-tertiary: #232834;
    --fg: #e8ecf3;
    --fg-muted: #9aa3b3;
    --fg-subtle: #5e6675;
    --border: #232a36;
    --border-strong: #2f3744;
    --border-focus: var(--primary);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 20px 32px -16px rgba(0, 0, 0, 0.6);
    --kbd-bg: #1a1f2a;

    --destructive: #f87171;
    --destructive-50: #2a1517;
    --destructive-600: #ef4444;
    --destructive-700: #dc2626;

    --success: #4ade80;
    --success-50: #142a1c;

    --warn: #fbbf24;
    --warn-50: #2a1f0a;

    --info: #38bdf8;
    --info-50: #0c2030;
  }

  /* Accent palettes (Tweaks-controlled) */
  :root[data-accent="indigo"] { --primary: #4f46e5; --primary-hover: #4338ca; --primary-soft: rgba(79, 70, 229, 0.10); --primary-on: #ffffff; }
  :root[data-accent="blue"]   { --primary: #2563eb; --primary-hover: #1d4ed8; --primary-soft: rgba(37, 99, 235, 0.10); --primary-on: #ffffff; }
  :root[data-accent="emerald"]{ --primary: #059669; --primary-hover: #047857; --primary-soft: rgba(5, 150, 105, 0.10); --primary-on: #ffffff; }
  :root[data-accent="amber"]  { --primary: #b45309; --primary-hover: #92400e; --primary-soft: rgba(180, 83, 9, 0.10); --primary-on: #ffffff; }
  :root[data-accent="slate"]  { --primary: #0f172a; --primary-hover: #1e293b; --primary-soft: rgba(15, 23, 42, 0.08); --primary-on: #ffffff; }
  :root[data-theme="dark"][data-accent="indigo"]  { --primary: #818cf8; --primary-hover: #a5b4fc; --primary-soft: rgba(129, 140, 248, 0.14); --primary-on: #0a0d14; }
  :root[data-theme="dark"][data-accent="blue"]    { --primary: #60a5fa; --primary-hover: #93c5fd; --primary-soft: rgba(96, 165, 250, 0.14); --primary-on: #0a0d14; }
  :root[data-theme="dark"][data-accent="emerald"] { --primary: #34d399; --primary-hover: #6ee7b7; --primary-soft: rgba(52, 211, 153, 0.14); --primary-on: #0a0d14; }
  :root[data-theme="dark"][data-accent="amber"]   { --primary: #fbbf24; --primary-hover: #fcd34d; --primary-soft: rgba(251, 191, 36, 0.14); --primary-on: #0a0d14; }
  :root[data-theme="dark"][data-accent="slate"]   { --primary: #e8ecf3; --primary-hover: #ffffff; --primary-soft: rgba(232, 236, 243, 0.10); --primary-on: #0a0d14; }

  /* Density */
  :root[data-density="compact"] { --row-pad-y: 8px; --card-pad: 16px; --gap: 8px; }
  :root[data-density="regular"] { --row-pad-y: 12px; --card-pad: 20px; --gap: 12px; }
  :root[data-density="comfy"]   { --row-pad-y: 16px; --card-pad: 24px; --gap: 16px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Inter", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv01", "tnum";
    min-height: 100vh;
  }
  ::selection { background: var(--primary-soft); color: var(--fg); }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-feature-settings: "tnum"; }
  .num  { font-variant-numeric: tabular-nums; }

  /* ============ App shell ============ */
  .app {
    display: grid;
    grid-template-columns: 248px 1fr;
    min-height: 100vh;
    background: var(--bg);
  }

  /* Sidebar */
  .side {
    background: var(--bg-primary);
    border-right: 1px solid var(--border);
    padding: 14px 12px 16px;
    display: flex; flex-direction: column; gap: 10px;
    position: sticky; top: 0; height: 100vh;
  }
  .org {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .org-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--primary); color: var(--primary-on);
    display: grid; place-items: center;
    font-family: "Inter", system-ui; font-weight: 700; font-size: 14px; letter-spacing: -0.02em;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, var(--shadow-sm);
  }
  .org-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .org-name small { display:block; color: var(--fg-muted); font-weight: 400; font-size: 11px; }
  .org-caret {
    margin-left: auto; color: var(--fg-subtle);
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    transition: background 120ms;
  }
  .org-caret:hover { background: var(--bg-secondary); }

  .status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 10px;
    background: var(--bg-secondary);
    font-size: 13px;
    border: 1px solid transparent;
    transition: border-color 120ms, background 120ms;
    cursor: pointer;
  }
  .status-pill:hover { background: var(--bg-tertiary); }
  .status-pill .dot-live {
    width: 8px; height: 8px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 3px var(--success-50);
    flex-shrink: 0;
  }
  .status-pill .lbl { color: var(--fg); font-weight: 600; font-size: 13px; }
  .status-pill .t { color: var(--fg-muted); font-size: 12px; margin-left: auto; }

  .nav-group { display: flex; flex-direction: column; gap: 1px; padding: 4px 0; }
  .nav-label {
    padding: 14px 10px 6px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--fg-subtle); font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--fg-muted);
    font-size: 13.5px; font-weight: 500;
    text-decoration: none; cursor: pointer; user-select: none;
    transition: background 80ms, color 80ms;
    position: relative;
  }
  .nav-item:hover { background: var(--bg-secondary); color: var(--fg); }
  .nav-item.active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px;
    width: 3px; background: var(--primary); border-radius: 0 3px 3px 0;
  }
  .nav-item svg {
    width: 18px; height: 18px; flex-shrink: 0;
    stroke: currentColor; stroke-width: 1.75; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .nav-item .kbd {
    margin-left: auto; font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--fg-subtle);
    background: var(--kbd-bg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-weight: 500;
  }
  .nav-item .badge {
    margin-left: auto; font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; font-weight: 700;
    background: var(--bg-tertiary); color: var(--fg-muted);
    border-radius: 999px; padding: 2px 7px;
  }
  .nav-item .badge.attn {
    background: var(--primary);
    color: var(--primary-on);
  }

  .me {
    margin-top: auto;
    display: flex; align-items: center; gap: 10px;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-primary);
    transition: background 120ms;
    cursor: pointer;
  }
  .me:hover { background: var(--bg-secondary); }
  .me .av {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: var(--primary-on);
    display: grid; place-items: center;
    font-family: "Inter", system-ui; font-weight: 700; font-size: 12px;
    letter-spacing: -0.02em;
  }
  .me .meta { line-height: 1.3; flex: 1; min-width: 0; }
  .me .meta .name { font-size: 13px; font-weight: 600; }
  .me .meta .role { font-size: 11px; color: var(--fg-muted); }
  .me .caret { color: var(--fg-subtle); font-size: 12px; }

  /* ============ Main ============ */
  .main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-primary);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .search {
    flex: 1; max-width: 520px;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--bg-secondary);
    color: var(--fg-subtle);
    font-size: 13px;
    border: 1px solid transparent;
    transition: border-color 120ms, background 120ms;
    cursor: pointer;
  }
  .search:hover { background: var(--bg-tertiary); }
  .search:focus-within { background: var(--bg-primary); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .search svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; stroke-width: 2; fill: none; }
  .search .ph { flex: 1; }
  .search .kbd-s { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px; padding: 1px 6px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; color: var(--fg-muted); }

  .top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-primary);
    display: grid; place-items: center;
    color: var(--fg-muted);
    cursor: pointer; position: relative;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .icon-btn:hover { background: var(--bg-secondary); color: var(--fg); border-color: var(--border-strong); }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .pip {
    position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--primary);
    border: 2px solid var(--bg-primary);
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px; font-weight: 600; line-height: 1;
    cursor: pointer; border: 1px solid transparent;
    transition: background 120ms, color 120ms, border-color 120ms, transform 60ms;
    font-family: inherit;
  }
  .btn:active { transform: translateY(0.5px); }
  .btn-primary {
    background: var(--primary); color: var(--primary-on);
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, var(--shadow-sm);
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline {
    background: var(--bg-primary); color: var(--fg);
    border-color: var(--border-strong);
  }
  .btn-outline:hover { background: var(--bg-secondary); }
  .btn-ghost {
    background: transparent; color: var(--fg);
  }
  .btn-ghost:hover { background: var(--bg-secondary); }
  .btn-destructive {
    background: var(--bg-primary); color: var(--destructive-600);
    border-color: var(--border-strong);
  }
  .btn-destructive:hover { background: var(--destructive-50); border-color: var(--destructive); }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
  .btn.sm { padding: 6px 10px; font-size: 12px; }

  /* ============ Workspace ============ */
  .work {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    min-height: 0;
  }
  .feed {
    padding: 28px 32px 40px;
    min-width: 0;
  }
  .rail {
    padding: 28px 28px 40px;
    display: flex; flex-direction: column;
    gap: 14px;
    background: var(--bg);
    border-left: 1px solid var(--border);
  }

  /* Feed header */
  .feed-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 24px;
  }
  .h-title {
    font-size: 26px; font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .h-title .wave {
    display: inline-block;
    transform-origin: 70% 70%;
    animation: wave 1.6s ease-in-out 1;
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(18deg); }
    50% { transform: rotate(-12deg); }
    75% { transform: rotate(8deg); }
  }
  .h-sub { font-size: 13px; color: var(--fg-muted); }
  .h-sub .ping {
    display: inline-flex; align-items: center; gap: 5px;
    margin-left: 4px;
  }
  .h-sub .ping i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    display: inline-block;
    box-shadow: 0 0 0 3px var(--success-50);
  }

  /* Tabs */
  .tabs {
    display: flex; gap: 2px;
    padding: 4px;
    background: var(--bg-secondary);
    border-radius: 10px;
    margin-bottom: 24px;
    width: fit-content;
  }
  .tab {
    padding: 8px 16px;
    font-size: 13px; font-weight: 500;
    color: var(--fg-muted);
    background: transparent; border: none;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 120ms, color 120ms;
    font-family: inherit;
  }
  .tab:hover { color: var(--fg); }
  .tab .count {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; font-weight: 700;
    padding: 1px 6px; border-radius: 999px;
    background: var(--bg-tertiary); color: var(--fg-muted);
  }
  .tab.active {
    background: var(--bg-primary);
    color: var(--fg);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .tab.active .count { background: var(--primary); color: var(--primary-on); }

  /* Quick cards */
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .q-card {
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    gap: 4px;
    transition: border-color 120ms, transform 120ms, box-shadow 120ms;
    cursor: pointer;
  }
  .q-card:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .q-card .lbl { font-size: 12px; color: var(--fg-muted); font-weight: 500; }
  .q-card .val { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; }
  .q-card .val small { font-size: 13px; color: var(--fg-muted); font-weight: 500; margin-left: 4px; }
  .q-card .arr { color: var(--fg-subtle); margin-top: 8px; font-size: 12px; display: flex; align-items: center; gap: 4px; transition: color 120ms; }
  .q-card:hover .arr { color: var(--primary); }
  .q-card.cta {
    background: linear-gradient(140deg, var(--primary), var(--primary-hover));
    color: var(--primary-on);
    border-color: var(--primary);
  }
  .q-card.cta .lbl { color: rgba(255,255,255,0.75); }
  .q-card.cta .val { color: var(--primary-on); }
  .q-card.cta .arr { color: rgba(255,255,255,0.85); }
  .q-card.cta:hover { transform: translateY(-1px); }

  /* Posts */
  .post {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--bg-primary);
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .post:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .post-h {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 10px;
  }
  .av-sm {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
    display: grid; place-items: center;
    font-family: "Inter", system-ui; font-weight: 600; font-size: 11px;
    color: var(--fg-muted);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .post-h .who-block { flex: 1; }
  .post-h .who { font-size: 13px; font-weight: 600; }
  .post-h .who .role { color: var(--fg-muted); font-weight: 400; }
  .post-h .meta { font-size: 12px; color: var(--fg-muted); }
  .post-h .pin {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px;
    background: var(--warn-50); color: var(--warn);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .post-b { padding: 0 20px 16px; }
  .post-b h3 {
    margin: 6px 0 8px;
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.4;
  }
  .post-b .text { color: var(--fg-muted); font-size: 13.5px; line-height: 1.6; }
  .post-b .text b { color: var(--fg); font-weight: 600; }
  .img-ph {
    height: 200px;
    background:
      repeating-linear-gradient(135deg, var(--bg-secondary) 0 14px, var(--bg-tertiary) 14px 16px);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 14px 0 4px;
    display: grid; place-items: center;
    color: var(--fg-subtle);
    font-family: "JetBrains Mono", monospace; font-size: 12px;
  }
  .img-ph small { display: block; text-align: center; color: var(--fg-subtle); margin-top: 3px; font-size: 11px; }

  .post-f {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    color: var(--fg-muted); font-size: 12.5px;
  }
  .react {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg-secondary);
    transition: background 120ms;
    cursor: pointer;
  }
  .react:hover { background: var(--bg-tertiary); }
  .react b { color: var(--fg); font-weight: 600; }
  .post-f .spread { margin-left: auto; font-size: 12px; }

  /* Event rows */
  .event-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-primary);
    margin-bottom: 10px;
    transition: border-color 120ms, transform 120ms;
    cursor: pointer;
  }
  .event-row:hover { border-color: var(--border-strong); transform: translateX(2px); }
  .event-row .date {
    font-family: "Inter", system-ui;
    width: 56px; flex-shrink: 0; text-align: center;
    padding: 4px 0;
    border-radius: 8px;
    background: var(--bg-secondary);
  }
  .event-row .date .m { font-size: 10px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; }

function FeedColumn() {
  const [tab, setTab] = React.useState("feed");
  React.useEffect(() => {
    document.querySelectorAll("[data-view]").forEach(v => v.classList.remove("is-active"));
    const el = document.querySelector(`[data-view="${tab}"]`);
    if (el) el.classList.add("is-active");
  }, [tab]);

  return (
    <main className="feed">
      <FeedHead />

      <div className="tabs" role="tablist">
        <button className={"tab" + (tab === "feed" ? " active" : "")} onClick={() => setTab("feed")}>홈 피드</button>
        <button className={"tab" + (tab === "news" ? " active" : "")} onClick={() => setTab("news")}>

        </button>
      </div>

      <FeedView />
      <NewsView />
      <TodoView />
    </main>
  );
}

function App() {

    document.documentElement.dataset.theme = t.theme;
    document.documentElement.dataset.accent = t.accent;
    document.documentElement.dataset.density = t.density;
  }, [t.theme, t.accent, t.density]);

  return (
    <>
      <div className="app">
        <Sidebar activePage="home" />
        <div className="main">
          <Topbar />
          <div className="work">
            <FeedColumn />
            <Rail />
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakRadio label="모드"
                    value={t.theme}
                    options={["light", "dark"]}
                    onChange={(v) => setTweak("theme", v)} />
        <TweakSelect label="액센트 컬러"
                     value={t.accent}
                     options={Object.keys(ACCENT_LABELS).map(k => ({
                       value: k, label: ACCENT_LABELS[k]
                     }))}
                     onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Density" />
        <TweakRadio label="간격"
                    value={t.density}
                    options={["compact", "regular", "comfy"]}
                    onChange={(v) => setTweak("density", v)} />
      </TweaksPanel>
    </>
  );
}
