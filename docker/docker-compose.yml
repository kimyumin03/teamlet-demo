name: teamlet

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamlet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamlet
      POSTGRES_PASSWORD: teamlet
      POSTGRES_DB: teamlet
    ports:
      - "5432:5432"
    volumes:
      - teamlet-pg:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamlet -d teamlet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teamlet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - teamlet-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: teamlet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - teamlet-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamlet-pg:
  teamlet-redis:
  teamlet-minio:
